name: MarkdownPrism
options:
  bundleIdPrefix: com.markdownprism
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_HARDENED_RUNTIME: true
    # Single source of truth for the version. Both Info.plists are generated
    # from this file by xcodegen and reference these as build settings, so this
    # is the only place a release bump needs to touch.
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "13"
  configs:
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
      # Shipped builds are universal. Intel Macs run macOS 14 and 15, and an
      # arm64-only binary refuses to launch there with nothing but a Finder
      # error. Debug builds stay single-arch so local iteration is quick.
      ARCHS: arm64 x86_64

targets:
  MarkdownPrism:
    type: application
    platform: macOS
    sources:
      - path: Sources/MarkdownPrism
        excludes:
          - "Info.plist"
          - "Resources/**"
          - "Assets.xcassets"
      - path: Sources/MarkdownPrism/Resources
        type: folder
        buildPhase: resources
      - path: Sources/MarkdownPrism/Assets.xcassets
        buildPhase: resources
    info:
      path: Sources/MarkdownPrism/Info.plist
      properties:
        CFBundleName: Markdown Prism
        CFBundleDisplayName: Markdown Prism
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes:
              - net.daringfireball.markdown
              - public.plain-text
            CFBundleTypeExtensions:
              - md
              - markdown
              - mdown
              - mkd
        UTImportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.plain-text
            UTTypeDescription: Markdown Document
            UTTypeIdentifier: net.daringfireball.markdown
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
                - mkd
    entitlements:
      path: MarkdownPrism.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    settings:
      PRODUCT_NAME: MarkdownPrism
      PRODUCT_BUNDLE_IDENTIFIER: com.markdownprism.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MarkdownPrismQuickLook
        embed: true

  MarkdownPrismQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/QuickLookExtension
        excludes:
          - "Info.plist"
      - path: Sources/MarkdownPrism/Resources
        type: folder
        buildPhase: resources
    info:
      path: Sources/QuickLookExtension/Info.plist
      properties:
        CFBundleDisplayName: Markdown Prism Quick Look
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - net.daringfireball.markdown
              - public.plain-text
            QLSupportsSearchableItems: false
    entitlements:
      path: MarkdownPrismQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.markdownprism.app.quicklook
      SKIP_INSTALL: true
    dependencies:
      - sdk: Quartz.framework
      - sdk: WebKit.framework
